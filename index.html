<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Atlas</title>

    <link rel="icon" href="data:,">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Carte principale -->
    <main id="map"></main>

    <!-- Barre de recherche -->
    <header class="search-container">

        <div class="brand">
            <span class="brand-icon">◈</span>
            <span>GAME ATLAS</span>
        </div>

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                type="text"
                id="search-input"
                placeholder="Rechercher un jeu vidéo..."
                autocomplete="off"
            >

            <button id="search-button" aria-label="Rechercher">
                ↵
            </button>

            <!-- Suggestions -->
            <div id="search-results" class="search-results hidden"></div>

        </div>

    </header>

    <!-- Panneau latéral -->
    <aside id="info-panel" class="info-panel hidden">

        <button id="close-panel" class="close-button" aria-label="Fermer">
            ×
        </button>

        <div id="panel-content"></div>

    </aside>

    <!-- Indicateur de chargement -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>Recherche des studios...</span>
    </div>

    <!-- Message d'information -->
    <div id="notification" class="notification hidden"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Application -->
    <script src="js/map.js"></script>
    <script src="js/wikidata.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
